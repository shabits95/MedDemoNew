# Network and Protocol Configuration
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory and Disk Settings
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Logging
log.console = true
log.console.level = info
log.file.level = info

# Connection and Channel Settings
channel_max = 2047
heartbeat = 60
frame_max = 131072

# Management Plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Metrics
prometheus.return_per_object_metrics = true

# Performance
collect_statistics_interval = 5000

# Default User (will be overridden by environment variables)
default_vhost = /
default_user = meduser
default_pass = medpassword
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# TLS (disabled for development)
listeners.ssl = none